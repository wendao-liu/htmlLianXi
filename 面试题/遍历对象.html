      from: 1,

      [Symbol.iterator]() {
        this.current = this.from;
        console.log(1111);
        return this;
      },

      next() {
        if (this.current <= this.to) {
          return { done: false, value: this.current++ };
        } else {
          return { done: true };
        }
      },
    };

      console.log(num); // 1, 然后是 2, 3, 4, 5
