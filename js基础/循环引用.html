<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    function cycle(obj, parent) {
        //表示调用的父级数组
        var parentArr = parent || [obj];
        for (var i in obj) {
            console.log(i);
            if (typeof obj[i] === "object") {
                //判断是否有循环引用
                parentArr.forEach((pObj) => {
                    console.log({ pObj });
                    if (pObj === obj[i]) {
                        obj[i] = "[cycle]"
                        throw new Error('循环引用')
                    }
                });
                cycle(obj[i], [...parentArr, obj[i]])
            }
        }
        return obj;
    }
    let obj = {
        a: 1, b: { c: { d: { e: 1 } } }
    }
    obj.b.c = obj.b
    const status = cycle(obj)
    console.log(status);
</script>

</html>
