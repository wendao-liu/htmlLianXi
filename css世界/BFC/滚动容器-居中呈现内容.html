<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>菜鸟教程(runoob.com)</title>
</head>

<body>
    <style>
        .content {
            width: 300px;
            height: 200px;
            position: relative;
        }

        .parent {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: auto;
        }

        .b {
            position: absolute;
            width: 500px;
            height: 100%;
            background: green;
        }

        .a {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: green;
            background: red;
            width: 50px;
            height: 50px;
        }
    </style>
    <div class="content">
        <div class="parent">
            <div class="b">bbb。</div>
        </div>
        <div class="a">aaaa</div>
    </div>
</body>

</html>
