<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    html,
    body {
        margin: 0;
        height: 100%;
    }

    .contain {
        display: flex;
        background: red;
        height: 100vh;
    }

    /* flex: 1 === flex: 1 1 auto */
    /* 宽度 ===（（总宽度 - 基准宽度)/基准比例 ）*基准比例 */
    .left {
        background: yellow;
        height: 100%;
        flex: 0 0 100px;
    }

    .center1 {
        background: blue;
        height: 100%;
        flex: 4 0 0%;
    }

    .center2 {
        background: pink;
        height: 100%;
        flex: 2 0 0%;
    }

    .right {
        flex: 0 0 100px;
        background: green;
        height: 100%;
    }
</style>

<body>

    <div class="contain">
        <div class="left">1</div>
        <div class="center1">2</div>
        <div class="center2">3</div>
        <div class="right">4</div>
    </div>
</body>

</html>
